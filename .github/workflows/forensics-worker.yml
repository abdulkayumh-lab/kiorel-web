name: KIOREL forensic worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  process-one-job:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FORENSICS_BUCKET: kiorel-media
      FORENSICS_ONE_SHOT: "true"
      FORENSICS_MAX_ATTEMPTS: "3"
      FORENSICS_WORKER_ID: github-actions-${{ github.run_id }}
      FORENSICS_ML_URL: ""
      FORENSICS_ML_ENABLE_DIRE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y exiftool
      - name: Install Python dependencies
        working-directory: services/forensics
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Process forensic queue
        working-directory: services/forensics
        run: python worker.py
